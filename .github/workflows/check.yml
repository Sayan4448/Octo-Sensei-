name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/check_agents.py --self-test
      - run: python3 scripts/check_agents.py

  mon-orga:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-orga
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
