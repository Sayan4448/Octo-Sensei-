name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/check_agents.py --self-test
      - run: python3 scripts/check_agents.py

  web:
    name: mon-orga interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-orga/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TZ: Europe/Paris
      # The same dates, seen from another time zone.
      - run: node --test test/store.test.js
        env:
          TZ: America/Los_Angeles

  android:
    name: mon-orga Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-orga/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

  pc:
    name: mon-orga Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mon-orga/pc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: mon-orga-windows
          path: mon-orga/pc/dist/*.exe
          retention-days: 7
